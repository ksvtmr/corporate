name: Remove preview

# Deletes gh-pages/pr-<N>/ when its pull request is merged or closed.
on:
  pull_request:
    types: [ closed ]
    branches: [ main ]

permissions:
  contents: write

jobs:
  remove:
    name: Remove preview pr-${{ github.event.pull_request.number }}
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    concurrency:
      group: gh-pages-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Delete preview folder
        run: bash scripts/publish-pages.sh "pr-${{ github.event.pull_request.number }}" "/${{ github.event.repository.name }}/" "Remove preview PR #${{ github.event.pull_request.number }}" --remove
